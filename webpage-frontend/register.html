<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Processor - Register</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>
    <main class="auth-container">
        <section class="auth-card">
            <h1>Image Processor</h1>
            <h2>Create Account</h2>

            <p class="subtitle"> Create an account to get started </p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username"> Username </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="50"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password"> Password </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" id="registerButton"> Create Account </button>
            </form>

            <p id="message" class="message" ></p>

            <p class="switch-page"> Already have an account? <a href="/login"> Login </a> </p>
        </section>
    </main>

    <script src="/js/register.js"></script>
</body>

</html>
